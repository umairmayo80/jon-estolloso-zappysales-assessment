# Production web entry point. TLS terminates at the edge/load balancer before
# this server. Deploy only behind HTTPS and set APP_COOKIE_SECURE=true.

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  server_tokens off;

  # This value is safe only when the public ingress is HTTPS-only for this host
  # and every included subdomain. Do not serve this configuration directly on HTTP.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self'; object-src 'none'; script-src 'self'" always;

  # The upstream must validate authentication, CSRF, authorization, and input.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Do not append an untrusted client-supplied X-Forwarded-For value. The
    # application uses this trusted hop for auth-rate-limit bucketing. If a
    # load balancer sits in front of Nginx, configure its real-IP module and
    # trusted source ranges before this boundary so $remote_addr is canonical.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 30s;
  }

  # Do not expose operational endpoints through the browser-facing proxy.
  location /actuator/ {
    return 404;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }
}
