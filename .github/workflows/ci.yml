name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-directory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verification and OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify API and Liquibase changelogs
        working-directory: backend
        run: ./mvnw -B verify
      - name: Start PostgreSQL for OpenAPI capture
        run: |
          cp .env.example .env
          docker compose --env-file .env up -d postgres
      - name: Capture runtime OpenAPI document
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/generated
          (
            cd backend
            exec ./mvnw -B spring-boot:run -Dspring-boot.run.profiles=dev
          ) > backend-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            docker compose --env-file .env down --volumes --remove-orphans || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat backend-api.log >&2
              exit 1
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo "Backend did not become ready within 120 seconds." >&2
            cat backend-api.log >&2
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:8080/v3/api-docs \
            --output docs/generated/openapi.json
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-evidence
          if-no-files-found: warn
          path: |
            backend/target/surefire-reports/**
            backend/target/failsafe-reports/**
            backend-api.log
            docs/generated/openapi.json

  frontend:
    name: Frontend lint, typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Component tests
        working-directory: frontend
        run: npm run test
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-evidence
          if-no-files-found: warn
          path: |
            frontend/coverage/**
            frontend/dist/**

  end-to-end:
    name: Browser journey tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start local dependency services
        run: |
          cp .env.example .env
          docker compose --env-file .env up -d postgres
      - name: Run user journey tests
        shell: bash
        run: |
          set -euo pipefail
          (
            cd backend
            exec ./mvnw -B spring-boot:run -Dspring-boot.run.profiles=dev
          ) > backend-e2e.log 2>&1 &
          backend_pid=$!
          (
            cd frontend
            exec npm run dev -- --host 127.0.0.1
          ) > frontend-e2e.log 2>&1 &
          frontend_pid=$!
          cleanup() {
            kill "$frontend_pid" "$backend_pid" 2>/dev/null || true
            docker compose --env-file .env down --volumes --remove-orphans || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:5173 >/dev/null \
              && curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null || ! kill -0 "$frontend_pid" 2>/dev/null; then
              cat backend-e2e.log frontend-e2e.log >&2
              exit 1
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo "Frontend and backend did not become ready within 120 seconds." >&2
            cat backend-e2e.log frontend-e2e.log >&2
            exit 1
          fi
          (cd frontend && npm run test:e2e)
      - name: Upload end-to-end evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: end-to-end-evidence
          if-no-files-found: warn
          path: |
            backend-e2e.log
            frontend-e2e.log
            frontend/playwright-report/**
            frontend/test-results/**

  containers-and-docs:
    name: Container and documentation validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose files
        run: |
          cp .env.example .env
          docker compose --env-file .env config
          APP_JWT_PRIVATE_KEY_FILE=/dev/null \
          APP_JWT_PUBLIC_KEY_FILE=/dev/null \
          APP_JWT_ISSUER=profile-directory-ci \
          APP_REFRESH_TOKEN_PEPPER=ci-only-placeholder \
          docker compose --env-file .env.example -f infra/docker-compose.prod.yml config
      - name: Build container images
        run: |
          docker build --tag profile-directory-backend:ci backend
          docker build --tag profile-directory-frontend:ci frontend
      - name: Install PDF validation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc texlive-xetex texlive-latex-extra poppler-utils fonts-dejavu
      - name: Validate PDF source and shell syntax
        run: |
          bash -n scripts/render-mockup-previews.sh
          bash -n scripts/render-submission-pdf.sh
          google-chrome --version
          scripts/render-mockup-previews.sh
          scripts/render-submission-pdf.sh --check-tools
          scripts/render-submission-pdf.sh
      - name: Upload documentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-evidence
          if-no-files-found: warn
          path: |
            output/pdf/**

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin,javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
