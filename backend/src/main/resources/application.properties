spring.application.name=profile-directory-api
# Local development is the default. Production deployments must explicitly activate prod.
spring.profiles.default=dev
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/profile_directory}
spring.datasource.username=${DATABASE_USERNAME:profile_directory}
spring.datasource.password=${DATABASE_PASSWORD:profile_directory}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=false

app.cookie.secure=${APP_COOKIE_SECURE:false}
app.jwt.issuer=${APP_JWT_ISSUER:profile-directory-api}
app.jwt.private-key-path=${APP_JWT_PRIVATE_KEY_PATH:}
app.jwt.public-key-path=${APP_JWT_PUBLIC_KEY_PATH:}
app.jwt.require-key-material=${APP_JWT_REQUIRE_KEY_MATERIAL:false}
app.jwt.access-ttl=${APP_JWT_ACCESS_TTL:PT15M}
app.refresh-token.pepper=${APP_REFRESH_TOKEN_PEPPER:development-only-refresh-token-pepper-change-me}
app.refresh-token.sliding-ttl=${APP_REFRESH_TOKEN_SLIDING_TTL:P7D}
app.refresh-token.absolute-ttl=${APP_REFRESH_TOKEN_ABSOLUTE_TTL:P30D}
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:false}
app.bootstrap.admin-email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin-display-name=${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:Directory Administrator}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.rate-limit.auth-requests=${APP_RATE_LIMIT_AUTH_REQUESTS:10}
app.rate-limit.auth-window=${APP_RATE_LIMIT_AUTH_WINDOW:PT1M}
app.request.max-body-size=${APP_REQUEST_MAX_BODY_SIZE:1MB}
app.seed-demo-data=${APP_SEED_DEMO_DATA:false}
