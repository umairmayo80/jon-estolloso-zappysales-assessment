springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# Runs on the private container/service port rather than the browser-facing API port.
management.server.port=8081
management.endpoints.web.exposure.include=health,metrics
logging.structured.format.console=logstash

# Deliberately no defaults in production: a missing secret/configuration must stop startup.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

app.cookie.secure=true
app.jwt.issuer=${APP_JWT_ISSUER}
app.jwt.private-key-path=${APP_JWT_PRIVATE_KEY_PATH}
app.jwt.public-key-path=${APP_JWT_PUBLIC_KEY_PATH}
app.jwt.require-key-material=true
app.refresh-token.pepper=${APP_REFRESH_TOKEN_PEPPER}
# Same-origin is the default. Set this environment value only for an intentional, reviewed CORS exception.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:false}
app.seed-demo-data=false
